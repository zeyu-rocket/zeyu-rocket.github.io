<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="Landscape photography by Zeyu Xu, from snow-covered peaks to dunes, lakeshores, and open grasslands.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Zeyu Xu | Landscape Photography">
  <meta property="og:description" content="Landscape photography by Zeyu Xu.">
  <meta property="og:url" content="https://zeyu-rocket.github.io/">
  <meta property="og:image" content="https://zeyu-rocket.github.io/assets/photos/clouds-over-steppe.webp">
  <title>Zeyu Xu | Landscape Photography</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/gallery.js" defer></script>
</head>
<body id="top">
  <header class="site-header wrap">
    <a class="wordmark" href="#top" aria-label="Zeyu Xu home">
      <span class="name">Zeyu Xu</span>
    </a>
    <nav aria-label="Main navigation"><a class="nav-link" href="#gallery">Gallery</a></nav>
  </header>

  <main>
    <figure class="cover wrap">
      <a class="cover-link photo-link" href="assets/photos/clouds-over-steppe.webp" data-title="Clouds over the Steppe" aria-label="View larger: Clouds over the Steppe">
        <img src="assets/photos/clouds-over-steppe.webp"
          srcset="assets/photos/clouds-over-steppe-small.webp 980w, assets/photos/clouds-over-steppe.webp 2000w"
          sizes="(max-width: 1504px) 96vw, 1440px"
          width="2000" height="1334" fetchpriority="high"
          alt="Dry grass and low hills stretch beneath layers of blue-gray clouds.">
        <span class="cover-caption">Clouds over the Steppe</span>
        <span class="cover-expand" aria-hidden="true">↗</span>
      </a>
    </figure>

    <section class="gallery wrap" id="gallery" aria-labelledby="gallery-title">
      <div class="section-heading">
        <h1 id="gallery-title">Landscapes</h1>
      </div>
      <div class="gallery-grid">
        <figure class="work work-wide">
          <a class="photo-link" href="assets/photos/dune-caravan.webp" data-title="Across the Dunes" aria-label="View larger: Across the Dunes">
            <img src="assets/photos/dune-caravan-small.webp"
              srcset="assets/photos/dune-caravan-small.webp 980w, assets/photos/dune-caravan.webp 2000w"
              sizes="(max-width: 690px) 94vw, (max-width: 1540px) 63vw, 940px" width="2000" height="1335" loading="lazy" decoding="async"
              alt="A line of camels follows a ridge through layered dunes at dusk.">
          </a>
          <figcaption>Across the Dunes</figcaption>
        </figure>
        <figure class="work work-tall">
          <a class="photo-link" href="assets/photos/dune-silhouettes.webp" data-title="Silhouettes on the Ridge" aria-label="View larger: Silhouettes on the Ridge">
            <img src="assets/photos/dune-silhouettes-small.webp"
              srcset="assets/photos/dune-silhouettes-small.webp 654w, assets/photos/dune-silhouettes.webp 1334w"
              sizes="(max-width: 690px) 46vw, (max-width: 1540px) 31vw, 460px" width="1334" height="2000" loading="lazy" decoding="async"
              alt="Two silhouettes hold hands on a dune ridge above ripples in the sand.">
          </a>
          <figcaption>Silhouettes on the Ridge</figcaption>
        </figure>
        <figure class="work work-tall">
          <a class="photo-link" href="assets/photos/lake.webp" data-title="Wind over the Lake" aria-label="View larger: Wind over the Lake">
            <img src="assets/photos/lake-small.webp"
              srcset="assets/photos/lake-small.webp 654w, assets/photos/lake.webp 1201w"
              sizes="(max-width: 690px) 46vw, (max-width: 1540px) 31vw, 460px" width="1201" height="1800" loading="lazy" decoding="async"
              alt="Wind turbines line the far shore of a rippling blue lake.">
          </a>
          <figcaption>Wind over the Lake</figcaption>
        </figure>
        <figure class="work work-wide">
          <a class="photo-link" href="assets/photos/dune-ascent.webp" data-title="Up the Dune" aria-label="View larger: Up the Dune">
            <img src="assets/photos/dune-ascent-small.webp"
              srcset="assets/photos/dune-ascent-small.webp 980w, assets/photos/dune-ascent.webp 2000w"
              sizes="(max-width: 690px) 94vw, (max-width: 1540px) 63vw, 940px" width="2000" height="1335" loading="lazy" decoding="async"
              alt="Two people pull colorful sandboards uphill, casting long shadows on the dune.">
          </a>
          <figcaption>Up the Dune</figcaption>
        </figure>
        <figure class="work work-tall">
          <a class="photo-link" href="assets/photos/grassland.webp" data-title="A Corner of the Steppe" aria-label="View larger: A Corner of the Steppe">
            <img src="assets/photos/grassland-small.webp"
              srcset="assets/photos/grassland-small.webp 655w, assets/photos/grassland.webp 1080w"
              sizes="(max-width: 690px) 46vw, (max-width: 1540px) 31vw, 460px" width="1080" height="1616" loading="lazy" decoding="async"
              alt="A stand of green trees rises from rolling grassland beneath a blue sky.">
          </a>
          <figcaption>A Corner of the Steppe</figcaption>
        </figure>
        <figure class="work work-tall">
          <a class="photo-link" href="assets/photos/lakeshore.webp" data-title="Along the Lakeshore" aria-label="View larger: Along the Lakeshore">
            <img src="assets/photos/lakeshore-small.webp"
              srcset="assets/photos/lakeshore-small.webp 784w, assets/photos/lakeshore.webp 1600w"
              sizes="(max-width: 690px) 46vw, (max-width: 1540px) 31vw, 460px" width="1600" height="2000" loading="lazy" decoding="async"
              alt="A lone walker crosses the grass beside a lake with wind turbines in the distance.">
          </a>
          <figcaption>Along the Lakeshore</figcaption>
        </figure>
        <figure class="work work-tall work-centered">
          <a class="photo-link" href="assets/photos/pasture-goats.webp" data-title="Pasture Light" aria-label="View larger: Pasture Light">
            <img src="assets/photos/pasture-goats-small.webp"
              srcset="assets/photos/pasture-goats-small.webp 654w, assets/photos/pasture-goats.webp 1334w"
              sizes="(max-width: 690px) min(94vw, 380px), (max-width: 1540px) 31vw, 460px" width="1334" height="2000" loading="lazy" decoding="async"
              alt="Sunlight catches the long coats of white goats huddled in a pasture.">
          </a>
          <figcaption>Pasture Light</figcaption>
        </figure>
        <figure class="work work-half">
          <a class="photo-link" href="assets/photos/snow-peak.webp" data-title="Golden Peak" aria-label="View larger: Golden Peak">
            <img src="assets/photos/snow-peak-small.webp"
              srcset="assets/photos/snow-peak-small.webp 1200w, assets/photos/snow-peak.webp 2440w"
              sizes="(max-width: 690px) 94vw, (max-width: 1540px) 47vw, 704px" width="2440" height="1627" loading="lazy" decoding="async"
              alt="Golden light falls on a snowy peak as clouds drift across the ridge.">
          </a>
          <figcaption>Golden Peak</figcaption>
        </figure>
        <figure class="work work-half">
          <a class="photo-link" href="assets/photos/sunset.webp" data-title="Sunset on the Steppe" aria-label="View larger: Sunset on the Steppe">
            <img src="assets/photos/sunset-small.webp"
              srcset="assets/photos/sunset-small.webp 980w, assets/photos/sunset.webp 1616w"
              sizes="(max-width: 690px) 94vw, (max-width: 1540px) 47vw, 704px" width="1616" height="1080" loading="lazy" decoding="async"
              alt="The sun sets behind distant hills, leaving the rocky foreground in shadow.">
          </a>
          <figcaption>Sunset on the Steppe</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <small>© Zeyu Xu</small>
    <a href="mailto:zeyu.xu.work@qq.com">Contact</a>
  </footer>

  <dialog class="viewer" aria-label="Photo viewer">
    <div class="viewer-inner">
      <button class="viewer-close" type="button" aria-label="Close photo viewer">×</button>
      <button class="viewer-prev" type="button" aria-label="Previous photo">‹</button>
      <figure class="viewer-figure">
        <img class="viewer-image" alt="">
        <figcaption class="viewer-caption" aria-live="polite"></figcaption>
      </figure>
      <button class="viewer-next" type="button" aria-label="Next photo">›</button>
    </div>
  </dialog>
</body>
</html>
