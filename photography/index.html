<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄影 | Zeyu Xu</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand"><a href="../index.html">Zeyu Xu</a></div>
        <ul class="nav-links">
            <li><a href="../index.html">首页</a></li>
            <li><a href="../projects/index.html">项目</a></li>
            <li><a href="index.html" class="active">摄影</a></li>
            <li><a href="../about.html">关于</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>摄影作品集</h1>
        <p class="intro">用镜头记录生活中的美好瞬间</p>

        <div class="gallery-filter">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="city">城市</button>
            <button class="filter-btn" data-filter="nature">自然</button>
            <button class="filter-btn" data-filter="people">人文</button>
        </div>

        <div class="gallery">
            <div class="gallery-item" data-category="city">
                <div class="placeholder-img">城市夜景</div>
                <div class="gallery-overlay">
                    <h3>城市夜景</h3>
                    <p>广州 · 2024</p>
                </div>
            </div>
            <div class="gallery-item" data-category="nature">
                <div class="placeholder-img">自然风光</div>
                <div class="gallery-overlay">
                    <h3>山间晨雾</h3>
                    <p>黄山 · 2024</p>
                </div>
            </div>
            <div class="gallery-item" data-category="people">
                <div class="placeholder-img">人文纪实</div>
                <div class="gallery-overlay">
                    <h3>老街手艺人</h3>
                    <p>潮州 · 2023</p>
                </div>
            </div>
        </div>

        <div class="equipment">
            <h2>我的器材</h2>
            <ul>
                <li>📷 Sony A7M4</li>
                <li>🔭 24-70mm f/2.8 GM</li>
                <li>🔭 85mm f/1.8</li>
                <li>🎒 Peak Design 背包</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>© 2026 徐泽宇 Zeyu Xu. All rights reserved.</p>
    </footer>
</body>
</html>
